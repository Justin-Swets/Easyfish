# Builds the addon zip and publishes it whenever a version tag is pushed:
#   git tag -a v2.8.3 -m "EasyFish 2.8.3" && git push origin v2.8.3
#
# Uploads to CurseForge (needs the CF_API_KEY repository secret and ## X-Curse-Project-ID in EasyFish.toc) and
# creates the GitHub release with the zip attached. Packaging rules live in .pkgmeta.
name: Package and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # lets the packager create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the packager can build the changelog since the previous tag

      - name: Package and upload
        uses: BigWigsMods/packager@v2
