<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1730"/>
      <stop offset="0.55" stop-color="#26406e"/>
      <stop offset="0.85" stop-color="#9c5a52"/>
      <stop offset="1" stop-color="#f09a4e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a7a9c"/>
      <stop offset="0.45" stop-color="#0c4a68"/>
      <stop offset="1" stop-color="#051e30"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.6" stop-color="#ffc85a"/>
      <stop offset="1" stop-color="#f28c38"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb566" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb566" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="red" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ff5a5f"/>
      <stop offset="0.6" stop-color="#d11f35"/>
      <stop offset="1" stop-color="#7d0f1e"/>
    </radialGradient>
    <radialGradient id="white" cx="0.38" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#e3e8ee"/>
      <stop offset="1" stop-color="#9aa6b3"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="0.5" stop-color="#d49a2f"/>
      <stop offset="1" stop-color="#8a5a14"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.55" stop-color="#f2c04d"/>
      <stop offset="1" stop-color="#b87a1c"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03111c" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#03111c" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#03111c" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="frame"><rect x="24" y="24" width="976" height="976" rx="120"/></clipPath>
    <clipPath id="aboveWater"><rect x="0" y="0" width="1024" height="560"/></clipPath>
    <clipPath id="bobber"><ellipse cx="512" cy="610" rx="100" ry="128"/></clipPath>
    <clipPath id="bobberTop"><rect x="0" y="0" width="1024" height="606"/></clipPath>
    <clipPath id="bobberDry"><rect x="0" y="0" width="1024" height="672"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="#0a1222"/>
  <g clip-path="url(#frame)">
    <rect width="1024" height="560" fill="url(#sky)"/>
    <circle cx="512" cy="560" r="330" fill="url(#glow)"/>
    <circle cx="512" cy="570" r="205" fill="url(#sun)" clip-path="url(#aboveWater)"/>
    <path d="M215,128.0 Q219.84,145.16 237,150.0 Q219.84,154.84 215,172.0 Q210.16,154.84 193,150.0 Q210.16,145.16 215,128.0Z" fill="#fff6d8" opacity="0.9"/><path d="M820,214.0 Q823.52,226.48 836,230.0 Q823.52,233.52 820,246.0 Q816.48,233.52 804,230.0 Q816.48,226.48 820,214.0Z" fill="#fff6d8" opacity="0.75"/><path d="M300,290.0 Q302.2,297.8 310,300.0 Q302.2,302.2 300,310.0 Q297.8,302.2 290,300.0 Q297.8,297.8 300,290.0Z" fill="#fff6d8" opacity="0.6"/>
    <rect y="560" width="1024" height="464" fill="url(#water)"/>
    <rect y="560" width="1024" height="6" fill="#ffd27a" opacity="0.55"/>
    <rect x="397.0" y="710" width="230" height="7" rx="3.5" fill="#ffcf73" opacity="0.55"/><rect x="427.0" y="740" width="170" height="7" rx="3.5" fill="#ffcf73" opacity="0.45"/><rect x="457.0" y="768" width="110" height="7" rx="3.5" fill="#ffcf73" opacity="0.35"/><rect x="484.0" y="792" width="56" height="7" rx="3.5" fill="#ffcf73" opacity="0.25"/>
    <ellipse cx="512" cy="668" rx="175" ry="36" fill="none" stroke="#bdefff" stroke-width="9" opacity="0.75"/><ellipse cx="512" cy="668" rx="265" ry="56" fill="none" stroke="#bdefff" stroke-width="7" opacity="0.45"/><ellipse cx="512" cy="668" rx="360" ry="78" fill="none" stroke="#bdefff" stroke-width="6" opacity="0.25"/>

    <!-- fishing line from the top-right corner to the bobber stem -->
    <path d="M 1010 -10 Q 820 150 516 440" fill="none" stroke="#f4f8ff" stroke-width="6" opacity="0.9"/>

    <!-- bobber: shadow, then body above the waterline -->
    <ellipse cx="512" cy="674" rx="126" ry="22" fill="#021019" opacity="0.55"/>
    <g clip-path="url(#bobberDry)">
      <ellipse cx="512" cy="610" rx="100" ry="128" fill="url(#white)"/>
      <g clip-path="url(#bobber)">
        <path d="M0 0 H1024 V616 Q512 636 0 616 Z" fill="url(#red)"/>
      </g>
      <ellipse cx="512" cy="610" rx="100" ry="128" fill="none" stroke="#1b0c10" stroke-width="7"/>
      <ellipse cx="476" cy="540" rx="26" ry="42" fill="#ffffff" opacity="0.55"
               transform="rotate(20 476 540)"/>
    </g>
    <!-- waterline across the bobber -->
    <path d="M 398 672 Q 512 690 626 672" fill="none" stroke="#bdefff" stroke-width="7" opacity="0.85"/>
    <!-- stem -->
    <rect x="501" y="438" width="22" height="54" rx="8" fill="#3a1d12" stroke="#1b0c10" stroke-width="5"/>
    <circle cx="512" cy="438" r="14" fill="#f2c04d" stroke="#1b0c10" stroke-width="5"/>
    
  </g>

  <!-- gold frame -->
  <rect x="24" y="24" width="976" height="976" rx="120" fill="none" stroke="url(#gold)" stroke-width="18"/>
  <rect x="40" y="40" width="944" height="944" rx="106" fill="none" stroke="#1a1004" stroke-width="4" opacity="0.7"/>
</svg>
